# Multi-site e2e config (MS_CONFIG) — sample. ONE file holds everything the multi-site e2e needs
# to REACH your hub + sites. Copy it, fill in your contexts/endpoints/VMs, and run:
#
#   make test-e2e SKIP_KIND_SETUP=true SKIP_OPERATOR_DEPLOY=true KUBECONTEXT=<hub-context> \
#     LABEL_FILTER='multisite' MS_CONFIG=/path/to/your-config.yaml
#
# Setting up the hub+sites substrate (Kubernetes clusters with mutually-routed pod networks, the
# operator deployed on the hub) is external, out-of-scope work — this file only tells the tests
# where it is. See docs/E2E_TESTING.md ("Multi-site").

hubContext: my-hub                      # kube-context where the operator + LittleRed CR live
operatorNamespace: littlered-system     # optional (default: littlered-system)

# Required ONLY for Scenario B (the hub-blind HOLD test): the hub operator's pod CIDR(s). The test
# denies it so the data-plane cut isolates a site FROM THE HUB ONLY (the sites stay mutually
# connected, so the survivors report cluster_state:ok and the operator must HOLD). Omit => Scenario
# B skips. Comma-separate multiple CIDRs.
hubPodCIDR: "10.0.0.0/16"

sites:
  - name: site-a                        # logical site name (as in spec.multiSite.sites)
    context: my-site-a                  # kube-context for this site's Kubernetes API
    endpoint: https://10.1.1.10:6443    # site API URL as routable FROM HUB PODS (not your laptop):
                                        #   the repl-net VIP baked into the site kubeconfig the
                                        #   operator dials. Wrong-vantage URL => the operator can't
                                        #   reach the site.
    # VMs are required ONLY for Scenario A (the whole-site kill). They define which hypervisor
    # domains ARE this site; the test hard-powers them off (virsh destroy) and back on (virsh
    # start). Needs non-interactive virsh (key-based qemu+ssh) to each URI. Omit => Scenario A skips.
    vms:
      - {name: site-a-node1, uri: qemu+ssh://user@hypervisor-a/system}
      - {name: site-a-node2, uri: qemu+ssh://user@hypervisor-a/system}
      - {name: site-a-node3, uri: qemu+ssh://user@hypervisor-a/system}
  - name: site-b
    context: my-site-b
    endpoint: https://10.1.2.10:6443
    vms:
      - {name: site-b-node1, uri: qemu+ssh://user@hypervisor-b/system}
      - {name: site-b-node2, uri: qemu+ssh://user@hypervisor-b/system}
      - {name: site-b-node3, uri: qemu+ssh://user@hypervisor-b/system}
