{{- /* Fail fast if both scoping lists are set (mirrors the operator's mutual-exclusion). */ -}}
{{- $scopeMode := include "littlered.scopeMode" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "littlered.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "littlered.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "littlered.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "littlered.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --zap-log-level={{ .Values.logLevel }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure=false
            {{- end }}
          env:
            # Operator's own namespace (downward API) — holds the leader-election
            # lease so a scoped operator's lease never lives cluster-wide (ADR-014).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- $watch := .Values.scope.watchNamespaces | default list }}
            {{- if gt (len $watch) 0 }}
            # Allow-list scoping: watch only these namespaces (ADR-014 Decision 1).
            - name: WATCH_NAMESPACE
              value: {{ join "," $watch | quote }}
            {{- end }}
            {{- $ignore := .Values.scope.ignoreNamespaces | default list }}
            {{- if gt (len $ignore) 0 }}
            # Deny-list scoping: watch all namespaces except these (ADR-014 Decision 1).
            - name: IGNORE_NAMESPACE
              value: {{ join "," $ignore | quote }}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      serviceAccountName: {{ include "littlered.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
