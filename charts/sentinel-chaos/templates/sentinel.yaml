apiVersion: redis.chuck-chuck-chuck.net/v1alpha1
kind: LittleRed
metadata:
  name: {{ .Values.sentinel.name }}
  annotations:
    redis.chuck-chuck-chuck.net/disable-polling: {{ .Values.sentinel.disablePolling | quote }}
spec:
  mode: sentinel
  sentinel:
    # REQUIRED. The Sentinel master name is the only isolation boundary
    # Sentinel gossip has: two instances sharing it on one pod network can
    # merge quorums and destroy each other's data. Scope it per instance.
    masterName: sample.sentinel
    quorum: {{ .Values.sentinel.quorum }}
    downAfterMilliseconds: {{ .Values.sentinel.downAfterMilliseconds }}
    failoverTimeout: {{ .Values.sentinel.failoverTimeout }}
