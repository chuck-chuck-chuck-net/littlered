apiVersion: redis.chuck-chuck-chuck.net/v1alpha1
kind: LittleRed
metadata:
  name: store-full
  # Labels and annotations on the LittleRed resource are inherited by every resource the
  # operator creates for it — StatefulSets, Services, ConfigMap, PDBs, ServiceMonitor and
  # the pods themselves — so scrape configs and dashboards can group on them. The
  # operator's own keys are never overridden, and Helm/Argo CD/Flux/kubectl bookkeeping is
  # not propagated. Editing these rolls the pods, because pod labels live in the pod
  # template.
  labels:
    team: payments
    environment: production
  annotations:
    owner: team-payments@example.com
spec:
  mode: standalone

  # Value for app.kubernetes.io/name on every owned resource. Immutable: the label is part
  # of the StatefulSet selector, which Kubernetes does not allow to change.
  appName: littlered

  image:
    registry: docker.io
    path: library/redis
    tag: "8.4.2"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  config:
    maxmemory: "900Mi"
    maxmemoryPolicy: noeviction
    timeout: 0
    tcpKeepalive: 300

  metrics:
    enabled: true
    exporter:
      # Registry inherits from image.registry if empty
      path: oliver006/redis_exporter
      tag: v1.89.0
    serviceMonitor:
      enabled: false
      interval: "30s"
      scrapeTimeout: "10s"

  service:
    type: ClusterIP

  updateStrategy:
    type: RollingUpdate

  podTemplate:
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
