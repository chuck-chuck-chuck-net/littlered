name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/littlered
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/littlered/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  chaos-client-image:
    name: Build and push chaos client image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/littlered-chaos-client
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/littlered-chaos-client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  lrctl:
    name: Build and release lrctl
    runs-on: ubuntu-latest
    needs: [image, chaos-client-image, chart]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              out="dist/lrctl-${GOOS}-${GOARCH}"
              GOOS=$GOOS GOARCH=$GOARCH go build -o "$out" ./cmd/lrctl/main.go
            done
          done
          GOOS=windows GOARCH=amd64 go build -o dist/lrctl-windows-amd64.exe ./cmd/lrctl/main.go

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Print the body of the CHANGELOG.md section whose heading starts with
          # the literal prefix $1, stopping at the next "## " heading.
          extract() {
            awk -v prefix="$1" '
              index($0, prefix) == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          }
          # Prefer the section for the exact released version. For a pre-release tag
          # (v0.4.0-rc1) fall back to the base version's section (0.4.0), which is what
          # the release actually contains -- without this an rc publishes empty notes,
          # because prepare-release.sh leaves [Unreleased] empty once a version is cut.
          # [Unreleased] stays as the last resort for an untagged-content release.
          notes="$(extract "## [${version}]")"
          base="${version%%-*}"
          if ! printf '%s' "$notes" | grep -q '[^[:space:]]' && [ "$base" != "$version" ]; then
            notes="$(extract "## [${base}]")"
          fi
          printf '%s' "$notes" | grep -q '[^[:space:]]' || notes="$(extract '## [Unreleased]')"
          : > release-notes.md
          if printf '%s' "$notes" | grep -q '[^[:space:]]'; then
            printf "## What's Changed\n%s\n\n" "$notes" >> release-notes.md
          fi
          cat >> release-notes.md <<'EOF'
          ## Container Images

          ```
          ghcr.io/${{ github.repository_owner }}/littlered:${{ github.ref_name }}
          ghcr.io/${{ github.repository_owner }}/littlered-chaos-client:${{ github.ref_name }}
          ```

          ## Helm Chart

          ```
          helm install littlered oci://ghcr.io/${{ github.repository_owner }}/charts/littlered --version ${{ github.ref_name }}
          ```
          EOF
          echo "----- generated release notes -----"
          cat release-notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          # A tag carrying a pre-release suffix (v0.4.0-rc1) must not become the
          # repository's headline release. Semver's own rule: a hyphen means pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  chart:
    name: Push Helm chart
    runs-on: ubuntu-latest
    needs: image
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify chart version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(grep '^version:' charts/littlered/Chart.yaml | awk '{print $2}')
          if [ "$TAG_VERSION" != "$CHART_VERSION" ]; then
            echo "ERROR: Git tag version (${TAG_VERSION}) does not match Chart.yaml version (${CHART_VERSION})"
            exit 1
          fi

      # Never push a chart that does not parse: a template-syntax error only
      # surfaces at `helm install` time, i.e. on the user's cluster.
      - name: Lint and render the chart
        run: make helm-lint

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package charts/littlered \
            --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.version }}

      - name: Push chart
        run: helm push littlered-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
