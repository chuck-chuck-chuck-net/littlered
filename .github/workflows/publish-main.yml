name: Publish main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and OCI labels per image. Each writes a bake file that redefines
      # that image's metadata target in docker-bake.hcl.
      - name: Extract metadata (operator)
        id: meta-operator
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/littlered
          bake-target: meta-littlered
          tags: |
            type=raw,value=latest
            type=sha

      - name: Extract metadata (chaos client)
        id: meta-chaos
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/littlered-chaos-client
          bake-target: meta-littlered-chaos-client
          tags: |
            type=raw,value=latest
            type=sha

      # The runner's default docker driver cannot export a build cache; a
      # docker-container builder can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Hands the cache service's URL and token to the run steps, where the
      # bake step's gha cache needs them; they are not in a step's environment.
      - name: Expose the GitHub Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and push the images
        env:
          GHA_CACHE: '1'
          META_OPERATOR_TAGS: ${{ steps.meta-operator.outputs.bake-file-tags }}
          META_OPERATOR_LABELS: ${{ steps.meta-operator.outputs.bake-file-labels }}
          META_CHAOS_TAGS: ${{ steps.meta-chaos.outputs.bake-file-tags }}
          META_CHAOS_LABELS: ${{ steps.meta-chaos.outputs.bake-file-labels }}
        run: |
          docker buildx bake --push \
            -f docker-bake.hcl \
            -f "$META_OPERATOR_TAGS" -f "$META_OPERATOR_LABELS" \
            -f "$META_CHAOS_TAGS" -f "$META_CHAOS_LABELS" \
            default
