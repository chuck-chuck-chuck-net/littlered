name: E2E Tests

# The e2e suite on a GitHub-hosted runner, against a local kind cluster.
#
# Unlike slaptain, no registry is involved: the suite's BeforeSuite builds the operator and
# chaos-client images with `make build-images`, `kind load`s them and deploys with
# PULL_POLICY=Never (test/e2e/e2e_suite_test.go deployOperator). So a run needs no published
# dev images, no packages:write and no wait on another workflow, and works for fork PRs too.
#
# The suite is split by deployment mode. Every spec carries exactly one mode label
# (hack/verify-e2e-mode-labels.sh checks the partition), so `make test-e2e MODE=<m>` across
# the four modes runs the whole suite exactly once. The two long modes are further split by
# test file (test/e2e/shards.txt: sentinel in three, cluster in two), so a full run is seven
# parallel jobs with a kind cluster each, and takes about as long as its slowest shard.
#
# Triggers:
#   - Run workflow (workflow_dispatch): pick one mode or all, optionally include 'extended'.
#   - A pull request labelled "e2e": every push to it, and adding the label.
#
# Tiers that skip by themselves here (no fixture on a runner):
#   - cluster migration (LEGACY_OPERATOR_IMAGE) and the sentinel operations upgrade tier
#     (PRE_OPERATIONS_OPERATOR_IMAGE) need a second, older operator image.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode to run (all = four parallel jobs)
        required: true
        type: choice
        options: [all, standalone, sentinel, cluster, failover]
        default: all
      extended:
        description: Also run the 'extended' tiers
        required: false
        type: boolean
        default: false

run-name: e2e ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

jobs:
  # One matrix entry per mode, or per shard for a mode test/e2e/shards.txt splits.
  plan:
    name: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the job matrix
        id: matrix
        env:
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          modes=""
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$MODE_INPUT" != all ]; then
            modes=$MODE_INPUT
          fi
          matrix=$(hack/e2e-shard.sh matrix "$modes")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Every spec in exactly one mode, and each split mode's shards adding up to it. A Ginkgo
  # dry run, no cluster. Runs beside the e2e jobs rather than gating them.
  split-check:
    name: check the mode and shard split
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the split
        run: make verify-e2e-mode-labels

  e2e:
    name: e2e (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}-${{ matrix.mode }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 6h. The suite's own deadline is set below it so
    # Ginkgo interrupts and reports instead of the runner being killed mid-spec.
    timeout-minutes: 330
    env:
      KIND_CLUSTER: littlered-test-e2e
      MODE: ${{ matrix.mode }}
      SHARD: ${{ matrix.shard }}
      E2E_ALL: ${{ inputs.extended && 'true' || 'false' }}
      E2E_TIMEOUT: 5h
      E2E_GO_TIMEOUT: 5h15m
      # Per failed spec: CR, pod logs, operator log and Redis state into
      # test/e2e/debug-artifacts-*, collected by the AfterEach while the spec's instance
      # still exists. DEBUG_ON_FAILURE is deliberately NOT set: once any spec fails,
      # suiteOrSpecFailed() stays true and every later spec's AfterAll skips deleting its
      # CR. On a 16 GB runner those leftovers starve the specs that follow, so one real
      # failure would cascade into many unrelated ones.
      E2E_COLLECT_ARTIFACTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record the spec-order seed
        run: |
          seed=$(date +%s)
          echo "SEED=$seed" >> "$GITHUB_ENV"
          sel="MODE=$MODE${SHARD:+ SHARD=$SHARD}"
          echo "\`$sel\`: Ginkgo seed \`$seed\`, replay with \`make test-e2e $sel SEED=$seed\`" >> "$GITHUB_STEP_SUMMARY"

      # The runner starts with ~14 GB free; two locally built images, the kind node image
      # and a few Redis images per kind node fit, but not with much margin.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Compile everything the suite will build while kind starts, so the build cache is warm.
      - name: Start compiling the suite and lrctl
        run: |
          (
            rc=0
            { go test -tags=e2e -c -o /dev/null ./test/e2e/ && make lrctl; } || rc=$?
            echo "$rc" > "$RUNNER_TEMP/compile.rc"
          ) > "$RUNNER_TEMP/compile.log" 2>&1 &

      # One control plane plus two workers: two schedulable nodes are what the cluster
      # placement spec needs (1 + replicasPerShard) and the minimum at which the kill-9 and
      # failover specs exercise cross-node traffic at all.
      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: test/e2e/kind-config.yaml

      # Docker Hub rate-limits anonymous pulls per IP, and every kind node pulls on its own.
      # Pull once on the runner and side-load, so pods with IfNotPresent never hit the registry.
      - name: Preload third-party images into kind
        run: |
          exporter=$(sed -n 's/^FROM //p' api/v1alpha1/redis-exporter.Dockerfile)
          images=(docker.io/library/redis:8.4.2 docker.io/library/busybox:latest "$exporter")
          if [ "$MODE" = cluster ]; then
            # image_upgrade_test.go walks 7.4.3 -> 7.4.8 -> the default.
            images+=(docker.io/library/redis:7.4.3 docker.io/library/redis:7.4.8)
          fi
          # Not `kind load docker-image`: with Docker's containerd image store (the runner's
          # default) `docker save` writes the multi-platform index but only this platform's
          # layers, and kind's `ctr import --all-platforms` then fails on a missing digest.
          # Saving one platform gives an archive whose index names only what it contains.
          # Through a file, not a pipe: kind reads the archive once per node.
          platform=linux/$(go env GOARCH)
          for img in "${images[@]}"; do
            archive="$RUNNER_TEMP/image-$RANDOM.tar"
            docker pull -q --platform "$platform" "$img"
            docker save --platform "$platform" -o "$archive" "$img"
            kind load image-archive "$archive" --name "$KIND_CLUSTER"
          done

      - name: Wait for the compile
        run: |
          until [ -e "$RUNNER_TEMP/compile.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/compile.log"
          exit "$(cat "$RUNNER_TEMP/compile.rc")"

      # The Makefile sees the existing kind cluster, skips creating it and, since it did not
      # create it, also skips deleting it, so the failure step below can still read it. The
      # suite itself undeploys the operator and deletes its namespace in AfterSuite, so the
      # per-spec artifacts are what carries a failure's state.
      - name: Run the ${{ matrix.name }} specs
        run: make test-e2e MODE="$MODE" SHARD="$SHARD" E2E_ALL="$E2E_ALL" SEED="$SEED" E2E_TIMEOUT="$E2E_TIMEOUT" E2E_GO_TIMEOUT="$E2E_GO_TIMEOUT"

      - name: Collect cluster state
        if: failure()
        run: |
          mkdir -p e2e-debug
          # The suite writes them relative to its working directory, which test/utils.Run()
          # switches to the repo root on first use, so they land there, not in test/e2e.
          shopt -s nullglob
          for dir in debug-artifacts-* test/e2e/debug-artifacts-*; do mv "$dir" e2e-debug/; done
          kubectl get pods -A -o wide > e2e-debug/pods.txt || true
          kubectl get events -A --sort-by=.lastTimestamp > e2e-debug/events.txt || true
          kind export logs --name "$KIND_CLUSTER" e2e-debug/kind || true

      - name: Upload cluster state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-${{ matrix.mode }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: e2e-debug/
          retention-days: 7
