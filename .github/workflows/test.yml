name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Same class of check as `go mod tidy` above: the repo carries generated
      # files (CRDs, RBAC, the chart's copies of both, and zz_generated.deepcopy.go)
      # that nothing used to verify -- edit a kubebuilder marker, forget
      # `make manifests generate`, and CI stayed green on a stale tree.
      - name: Check generated files are up to date
        run: make verify-generated

      - name: Running Tests
        run: make test
