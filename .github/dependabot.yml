version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          # Pinned to a Kubernetes minor: v0.94.1 requires k8s.io/api v0.37.0,
          # so a lone bump drags the whole stack along by minimum-version
          # selection under a prometheus-operator title (#145). Move it with
          # the group it actually belongs to.
          - "github.com/prometheus-operator/prometheus-operator/pkg/apis/monitoring"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /cmd/littlered
      - /cmd/littlered-chaos-client
      # Pinned default redis_exporter sidecar image (source of truth for the
      # operator's Go defaults; embedded via //go:embed in api/v1alpha1).
      - /api/v1alpha1
    schedule:
      interval: weekly
    groups:
      golang:
        patterns:
          - "golang"
    # The builder image must not drift off the Go line that go.mod declares.
    # Docker tags like `1.27rc2` carry no semver pre-release separator, so
    # Dependabot ranks them above the stable line and proposed one; patch bumps
    # (security fixes) stay automatic, minor/major is a deliberate change made
    # together with the `go` directive in go.mod.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: helm
    directory: /charts/littlered
    schedule:
      interval: weekly
