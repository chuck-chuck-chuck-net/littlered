# M1 acceptance work list (docs/E2E_SOAK_HARNESS_DESIGN.md §11) — also the
# fastest smoke test of the harness itself, and the default work list.
#
# Five items, one of which is DELIBERATELY made to fail, to prove the array
# mechanics: the failing item parks its namespace (and, since M2, its own
# operator) for forensics, the remaining items still run, and the rollup reports
# "5 items, 4 green" at a glance.
#
# Every item is the same ~1-minute spec, which makes this simultaneously the
# degenerate SOAK case (§9.1: "work list = [item] x N") and a fast harness
# iteration — the second of §11's two disciplines.
#
# HOW THE DELIBERATE FAILURE WORKS: the doomed item pins a redis image that is
# pullable but is not redis. The pods therefore never become Ready, the spec's
# "wait for Running" fails, and the item travels the whole real failure path —
# Ginkgo marks it failed, the suite's AfterEach collects debug artifacts, and
# (because the driver always sets DEBUG_ON_FAILURE=true) the suite skips its own
# cleanup. That pairing between the suite's skip-cleanup and the driver's
# parking is precisely what §4.2 relies on, so it is the thing worth proving.
#
# Two mechanisms were rejected for it:
#   - A per-item image override pointing at a tag that does NOT exist (what this
#     list used before M2). It fails inside BeforeSuite, where the AfterEach
#     artifact collector never runs — which is exactly why M1 could not verify
#     artifact relocation. It is also what the launch-time image preflight now
#     refuses, so keeping it would have made the SMOKE fixture the one array you
#     must disable the safety check to run.
#   - A too-short per-item timeout: it parks the namespace by SIGKILL, bypassing
#     the suite's failure handling entirely, and proves less. (That path is
#     still covered deliberately by worklist-selftest.yaml.)

array: m1smoke

defaults:
  # The pdb standalone spec settles in well under two minutes; 8m is generous
  # headroom for image pulls on a cold node without letting a wedged item eat
  # the run.
  timeout: 8m
  env:
    E2E_TOPOLOGY: single
  # For an unattended array, add a mirrored redis image here so the run does not
  # depend on Docker Hub (§9.3) — and mirror the exporter with it, since it
  # inherits this registry. See test/harness/README.md.
  #   redisImage: myregistry.example/library/redis:8.4.2

items:
  - name: pdb-standalone-a
    labelFilter: pdb
    focus: should never create a PDB in standalone mode

  - name: pdb-standalone-b
    labelFilter: pdb
    focus: should never create a PDB in standalone mode

  # --- the deliberate failure -------------------------------------------------
  # alpine is small, public and genuinely pullable — so the launch preflight and
  # the suite's BeforeSuite image check both pass — but it is not redis, so the
  # pod never serves and the spec fails ~2 minutes in.
  - name: pdb-standalone-doomed
    labelFilter: pdb
    focus: should never create a PDB in standalone mode
    redisImage: docker.io/library/alpine:3.20

  - name: pdb-standalone-c
    labelFilter: pdb
    focus: should never create a PDB in standalone mode

  - name: pdb-standalone-d
    labelFilter: pdb
    focus: should never create a PDB in standalone mode
