# The classic SOAK workload (docs/E2E_SOAK_HARNESS_DESIGN.md §1, §9.1).
#
# "Run the suite N times on a fixed image and tell me how many were green."
# In a work-list driver that is not a special mode — it is the degenerate list
# where every item is identical. Add or remove items to change N.
#
# Since M2 every item gets its own test namespace AND its own namespace-scoped
# operator, deployed from the array's pinned image — so a parked failure keeps a
# live operator for forensics and later items cannot be reconciled by it (§3).
#
# Set `redisImage` to a mirrored copy of the redis image if the run must not
# depend on Docker Hub (§9.3); see worklist-m2-classic.yaml.
#
# Each item is a full suite run, so size the timeout accordingly: a full run is
# ~40 minutes and the suite's own `go test` deadline is 120m.

array: soak

defaults:
  timeout: 100m

items:
  - name: run-00
    labelFilter: "!extended"
  - name: run-01
    labelFilter: "!extended"
  - name: run-02
    labelFilter: "!extended"
  - name: run-03
    labelFilter: "!extended"
  - name: run-04
    labelFilter: "!extended"
