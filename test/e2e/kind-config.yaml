# kind cluster for the e2e suite on GitHub-hosted runners (.github/workflows/test-e2e.yml).
# Locally, `make test-e2e` creates a single-node cluster instead; pass this file to
# `kind create cluster --config` to reproduce the CI shape.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
